# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MAVEN_OPTS: -Dapi.version=1.44
    strategy:
      matrix:
        java: [17, 21]

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Check out the platform parent
      uses: actions/checkout@v4
      with:
        repository: lareferencia/lareferencia-platform
        ref: main
        path: .platform-parent
        persist-credentials: false
    - name: Resolve the matching committed platform parent
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 - <<'PYCODE'
        import json, subprocess, xml.etree.ElementTree as E
        from pathlib import Path
        ns = '{http://maven.apache.org/POM/4.0.0}'
        version = E.parse('pom.xml').getroot().findtext(ns + 'parent/' + ns + 'version')
        def git(*args):
            return subprocess.run(['git', '-C', '.platform-parent', *args], text=True, capture_output=True)
        def matching(ref):
            result = git('fetch', 'origin', ref)
            if result.returncode:
                return None
            sha = git('rev-parse', 'FETCH_HEAD').stdout.strip()
            pom = git('show', sha + ':pom.xml')
            return sha if E.fromstring(pom.stdout).findtext(ns + 'version') == version else None
        chosen = matching('refs/tags/' + version) or matching('main')
        if not chosen:
            prs = json.loads(subprocess.check_output(['gh', 'pr', 'list', '--repo', 'lareferencia/lareferencia-platform', '--state', 'open', '--json', 'headRefOid'], text=True))
            candidates = {sha for pr in prs if (sha := matching(pr['headRefOid']))}
            if len(candidates) != 1:
                raise SystemExit('Push one coordinator PR with matching parent version before retrying module CI.')
            chosen = candidates.pop()
        result = git('checkout', '--detach', chosen)
        if result.returncode:
            raise SystemExit(result.stderr)
        print('Using committed platform parent', version, chosen)
        PYCODE
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: temurin
        cache: maven
    - name: Install the inherited platform parent
      run: ./mvnw --batch-mode -N -f .platform-parent/pom.xml install -DskipTests -Dmaven.javadoc.skip=true
    - name: Build with Maven
      run: ./mvnw --batch-mode clean verify -Dmaven.javadoc.skip=true
    - name: Build install package
      if: matrix.java == 17
      run: tar cvfz oai-pmh.tgz oai-pmh.* config
    - uses: actions/upload-artifact@v4
      if: matrix.java == 17
      with:
        name: oai-pmh-install
        path: oai-pmh.tgz
