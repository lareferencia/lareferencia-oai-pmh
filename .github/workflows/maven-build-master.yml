# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MAVEN_OPTS: -Dapi.version=1.44
    strategy:
      matrix:
        java: [17, 21]

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Check out the platform parent
      uses: actions/checkout@v4
      with:
        repository: lareferencia/lareferencia-platform
        ref: main
        path: .platform-parent
        persist-credentials: false
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: temurin
        cache: maven
    - name: Install the inherited platform parent
      run: ./mvnw --batch-mode -N -f .platform-parent/pom.xml install -DskipTests -Dmaven.javadoc.skip=true
    - name: Build with Maven
      run: ./mvnw --batch-mode clean verify -Dmaven.javadoc.skip=true
    - name: Build install package
      if: matrix.java == 17
      run: tar cvfz oai-pmh.tgz oai-pmh.* config
    - uses: actions/upload-artifact@v4
      if: matrix.java == 17
      with:
        name: oai-pmh-install
        path: oai-pmh.tgz
